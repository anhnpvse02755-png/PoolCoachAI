name: Android / test

# Kiểm tra mỗi lần đẩy lên main hoặc mở PR: analyze + test + build APK debug.
# Không có android/key.properties trên CI nên APK ký bằng khoá debug.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - run: flutter pub get

      # database.g.dart không được commit.
      - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter analyze

      # Helper thông báo của máy chủ: biên dịch AOT thuần Dart, nên Flutter
      # lọt vào closure import là hỏng ngay ở đây. `dart compile exe` từ chối
      # dự án có package chạy build hook (objective_c, kéo theo bởi Flutter),
      # nên dùng `dart build cli`, cùng một bộ biên dịch AOT.
      - run: dart build cli -t bin/notify_plan.dart -o build/notify_plan

      - run: build/notify_plan/bundle/bin/notify_plan --self-test

      - run: flutter test

      - run: flutter test --platform chrome test/domain/notifications/notification_id_test.dart test/domain/notifications/seed_fingerprint_test.dart

      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: poolcoachai-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
