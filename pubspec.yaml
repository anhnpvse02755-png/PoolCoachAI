name: poolcoachai
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # Bản dịch sẵn của Material/Cupertino. App khoá tiếng Việt hoàn toàn,
  # nên nút back, chọn ngày, menu chọn chữ đều phải ra tiếng Việt.
  flutter_localizations:
    sdk: flutter

  # usePathUrlStrategy: URL dạng /reset-password?token=…, không có dấu #.
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  google_fonts: ^8.2.1

  # Drift/SQLite: nơi lưu mọi thứ app hiển thị. sqlite3_flutter_libs
  # mang theo thư viện native cho bản cài, path_provider tìm chỗ đặt
  # file DB trên từng hệ điều hành.
  drift: ^2.27.0
  drift_flutter: ^0.2.8
  sqlite3_flutter_libs: ^0.5.31
  path_provider: ^2.1.5
  path: ^1.9.1

  # Gọi REST của Directus. Không có SDK Dart chính thức — xem spec mục 2.1.
  http: ^1.6.0
  # Id buổi tập: phải duy nhất giữa mọi người dùng trên server chung.
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # build_runner sinh database.g.dart từ khai báo bảng trong
  # lib/data/database/database.dart — chạy lại sau mỗi lần đổi bảng.
  build_runner: ^2.4.15
  drift_dev: ^2.27.0

flutter:
  uses-material-design: true
