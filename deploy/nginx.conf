server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # App dùng URL dạng đường dẫn (/training/drills/d1): mọi đường dẫn không
    # phải file thật đều trả index.html để Flutter tự định tuyến, gõ thẳng
    # hay tải lại trang cũng không 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tên file Flutter không có hash (main.dart.js, flutter_bootstrap.js,
    # drift_worker.js, sqlite3.wasm), nên không được cache "immutable":
    # deploy mới sẽ không tới tay người dùng. no-cache = vẫn giữ bản sao
    # nhưng hỏi lại server bằng ETag, file không đổi thì chỉ tốn một 304.
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;
}
